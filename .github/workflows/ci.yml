name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job needs write access.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Generated code is up to date
        run: |
          python3 codegen/generate.py
          cargo fmt
          git diff --exit-code -- src tests codegen/report.json
      - name: Every api.md method maps to a spec operation
        run: python3 -c 'import json,sys; r=json.load(open("codegen/report.json")); sys.exit(1 if r["api_md_methods_missing_from_spec"] or r["warnings"] else 0)'
      - name: No dependencies published in the last 24 hours
        run: python3 codegen/check_crate_age.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  zizmor:
    name: Audit workflows with zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        run: pipx run zizmor==1.30.1 --persona=pedantic .github/workflows/

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: |
          rustup toolchain install 1.88 --profile minimal
          rustup default 1.88
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets
