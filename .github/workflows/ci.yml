name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Generated code is up to date
        run: |
          python3 codegen/generate.py
          cargo fmt
          git diff --exit-code -- src tests codegen/report.json
      - name: Every api.md method maps to a spec operation
        run: python3 -c 'import json,sys; r=json.load(open("codegen/report.json")); sys.exit(1 if r["api_md_methods_missing_from_spec"] or r["warnings"] else 0)'
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
