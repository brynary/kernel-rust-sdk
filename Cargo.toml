[package]
name = "kernel-sdk"
version = "0.118.0"
edition = "2021"
rust-version = "1.88"
description = "Rust client for the Kernel API (https://www.kernel.sh)"
license = "Apache-2.0"
repository = "https://github.com/brynary/kernel-rust-sdk"
readme = "README.md"
keywords = ["kernel", "browser", "api", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[lib]
name = "kernel"

[dependencies]
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time", "io-util"] }
url = "2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false }
chrono = "0.4"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
wiremock = "0.6"
